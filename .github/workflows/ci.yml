name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Catalog check
        run: npm run catalog:check

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build -w @repairloop/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://repairloop-api.onrender.com

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: E2E
        run: npm run test:e2e
